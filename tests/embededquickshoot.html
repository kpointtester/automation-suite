<!---
Usage:
  embededquickshoot.html?host=vega-automation.zencite.in&kcid=YOUR_KCID&token=YOUR_TOKEN

  Optional params:
    capture=monitor|window|browser   screen capture surface (default: monitor)
    systemAudio=true|false           require system audio in the screen share (default: true)

  One PiP recording: the screen is recorded with the camera shown picture-in-picture, and a
  single "Submit Recording" uploads one video (named exactly as entered in the prompt).

  Note on token in URL: tokens can be long and contain +, /, = — encodeURIComponent the token
  before appending it to the URL, otherwise the + signs get decoded as spaces.

  Camera / microphone health events (Rigel "camerahealth" / "microphonehealth") are logged,
  alerted, and collected in window.qsHealthEvents for automation.
  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Page</title>
    <style>
      .kpoint-recording-controls {
        display: flex;
        padding: 5px;
        margin: 5px;
      }
      .kpoint-recording-controls button {
        padding: inherit;
        margin: 10px;
        border-radius: 10px;
      }
      .kpoint-recording-controls .start {
        background: #d9ebeb;
      }
      .kpoint-recording-controls .stop {
        background: #e2c0c0;
      }
      .kpoint-recording-controls .submit {
        background: #9fe6a8;
      }
    </style>
    <script>
      // Read config from URL query params: ?host=...&kcid=...&token=...
      const _params = new URLSearchParams(window.location.search);
      const _host  = _params.get("host")  || "vega-automation.zencite.in";
      const _kcid  = _params.get("kcid")  || "";
      const _token = _params.get("token") || "";
      const _capture = _params.get("capture") || "monitor";        // browser | window | monitor
      const _systemAudio = (_params.get("systemAudio") || "true") !== "false";

      // Camera / microphone health events, readable by automation
      window.qsHealthEvents = [];

      // Load the embed script from the requested host
      (function() {
        const s = document.createElement("script");
        s.async = true;
        s.type  = "text/javascript";
        s.src   = "https://" + _host + "/assets/orca/media/embed/quickshootEmbed.js?1";
        document.head.appendChild(s);
      })();
    </script>
    <script>
      function createRigelInstance() {
        window.rigelscreen = new Rigel({
          "host": _host,
          "embed": true,
          "screenCaptureElement": _capture,
          "detectSystemAudio": _systemAudio,
          "kcid": _kcid,
          "token": _token
        });
        window.rigelcamera = new Rigel({
          "host": _host,
          "embed": true,
          "type": "video",
          "kcid": _kcid,
          "token": _token
        });
        setTimeout(() => {
          if (window.rigelcamera && typeof window.rigelcamera.on === "function") {
            window.rigelcamera.on("camerahealth", function (event) {
              console.log("[Camera Health Event]", event);
              window.qsHealthEvents.push({ type: "camerahealth", healthy: event.healthy, reason: event.reason });
              if (!event.healthy) {
                alert("⚠️ Camera has been disabled (" + event.reason + ").");
              } else {
                console.log("[Camera Health] Camera is healthy");
              }
            });

            window.rigelcamera.on("microphonehealth", function (event) {
              console.log("[Microphone Health Event]", event);
              window.qsHealthEvents.push({ type: "microphonehealth", healthy: event.healthy, reason: event.reason });
              if (!event.healthy) {
                alert("⚠️ Microphone has been disabled (" + event.reason + ").");
              } else {
                console.log("[Microphone Health] Microphone is healthy");
              }
            });
          }
          window.rigelcamera.initCameraRecorder()
          .then(() => {
            console.log("Camera recorder initialized successfully.");
          }).catch((err) => {
            console.error("Error initializing camera recorder: " + err.message);
          });
        }, 1000);
      }
      function onDocumentReady(callback) {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", callback);
        } else {
          callback();
        }
      }

      function addEventListenerForRigelScriptLoading(){
        document.addEventListener("rigelScriptLoaded",() => {
          console.log("**************** Rigel script loaded *********************");
          createRigelInstance();
        });
      }

      onDocumentReady(function() {
        // Sync data-host attribute with the runtime value
        document.getElementById("rigel-root").setAttribute("data-host", _host);
        addEventListenerForRigelScriptLoading();
      });
    </script>
</head>
<body>
<!-- Below div with data-host is necessary to integrate functionality of recording -->
  <div id="rigel-root" data-host="vega-automation.zencite.in">
    <div class="container">
      <div class="header">
          <h1>Assessment Page</h1>
          <div class="kpoint-recording-controls">
            <button class="start" id="startRecording">Start Screen Recording</button>
            <button class="stop" id="stopRecording">Stop Screen Recording</button>
            <button class="submit" id="submitRecording">Submit Screen Recording</button>
          </div>
          <p id="submissionMessage" style="display:none;margin: 10px; padding:10px;">Recording has been submitted.</p>
          <p>Please complete the assessment below:</p>
      </div>
      <div class="assessment">
          <h2>Question 1</h2>
          <p>What is the capital of France?</p>
          <input type="text" name="question1" id="question1" placeholder="Your answer here">
      </div>
      <div class="assessment">
          <h2>Question 2</h2>
          <p>What is 2 + 2?</p>
          <input type="text" name="question2" id="question2" placeholder="Your answer here">
      </div>
    </div>
  </div>
  <script>
    // 3 buttons: start, stop and submit recording
    const startBtn = document.getElementById('startRecording');
    const stopBtn = document.getElementById('stopRecording');
    const submitBtn = document.getElementById('submitRecording');
    const submissionMessage = document.getElementById('submissionMessage');

    // Call startScreenRecorder to start recording your screen (camera shown picture-in-picture)
    async function startScreenRecording() {
        try {
            await window.rigelscreen.startScreenRecorder();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            submitBtn.disabled = true;
        } catch(err){
            console.log("Error in start recording => ", err);
            handleScreenRecordingError(err);
        }
    }

    function handleScreenRecordingError(err) {
        if (err.code === "INVALID_DISPLAY_SURFACE") {
          alert(`Error: ${err.message}\nExpected: ${err.expected}\nYou selected: ${err.actual}\nSystem audio selected: ${err.systemAudioSelected}`);
          console.error("Display surface error:", { code: err.code, expected: err.expected, actual: err.actual, systemAudioSelected: err.systemAudioSelected });
        } else if (err.code === "SYSTEM_AUDIO_REQUIRED") {
          alert(`Error: ${err.message}\nSystem audio must be enabled for recording.`);
          console.error("System audio error:", { code: err.code, systemAudioSelected: err.systemAudioSelected });
        } else if (err.code === "INVALID_SELECTION") {
          alert(`Error: ${err.message}\nDisplay Surface Error: ${err.displaySurfaceError}\nSystem Audio Error: ${err.systemAudioError}`);
          console.error("Selection validation error:", { code: err.code, displaySurfaceError: err.displaySurfaceError, systemAudioError: err.systemAudioError, systemAudioSelected: err.systemAudioSelected });
        } else {
          alert(`Recording error: ${err.message}`);
          console.error("Error:", err);
        }
    }

    // Call stopScreenRecorder to stop recording your screen
    async function stopScreenRecording() {
        try {
            window.rigelscreen.stopScreenRecorder();
            stopBtn.disabled = true;
            startBtn.disabled = true;
            submitBtn.disabled = false;
        } catch(err){
            console.log("Error in stop recording => ", err);
        }
    }

    // Call submitRecording to submit the recording (one PiP video: screen + camera)
    async function submitScreenRecording() {
        const recordingName = prompt("Please enter the name for your recording:");
        if (recordingName) {
          try {
              window.rigelscreen.submitRecording(`${recordingName}`);
              startBtn.disabled = true;
              stopBtn.disabled = true;
              submitBtn.disabled = true;
              submissionMessage.style.display = 'block';
          } catch(err){
              console.log("Error in submit recording => ", err);
          }
          console.log(`Submitted screen recording with the name: ${recordingName}`);
        } else {
          submitBtn.disabled = false;
          alert("No name entered. Recording not submitted.");
        }
    }
    startBtn.addEventListener('click', startScreenRecording);
    stopBtn.addEventListener('click', stopScreenRecording);
    submitBtn.addEventListener('click', submitScreenRecording);
  </script>
</body>
</html>
